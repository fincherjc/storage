model: 
  name: resnet50
  type: cnn

framework: tensorflow

workflow:
 generate_data: False
 train: True

dataset:
 num_files_train: 1024
 num_samples_per_file: 1251
 record_length_bytes: 114660.07
 record_length_bytes_resize: 150528
 data_folder: data/resnet50
 format: tfrecord

train: 
 epochs: 5
 # computation_time will come from accelerator config
 
reader:
 data_loader: tensorflow
 read_threads: 8
 computation_threads: 8
 batch_size: 400
 # dont_use_mmap will come from accelerator config (a100 only)

metric:
 au: 0.90

